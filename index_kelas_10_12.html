<!DOCTYPE html>
<html lang="id">
<head>

<title>UjianKu</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);color:#172033}
button,input{font:inherit}.hidden{display:none!important}.container{width:min(1100px,94%);margin:auto}
.login{min-height:100vh;display:flex;justify-content:center;align-items:center}
.login-box{width:420px;max-width:94%;background:#fff;padding:35px;border-radius:24px;box-shadow:0 15px 50px #0002}
.logo{text-align:center;font-size:34px;font-weight:800;color:#4f46e5;margin-bottom:8px}
.subtitle{text-align:center;color:#64748b;margin-bottom:30px}
.input{width:100%;padding:14px;border:1px solid #dbe1ea;border-radius:12px;margin:8px 0 18px;outline:none}
.input:focus{border-color:#6366f1}
.btn{width:100%;border:0;padding:14px;border-radius:12px;background:#4f46e5;color:#fff;font-weight:bold;cursor:pointer}
header{background:#fff;box-shadow:0 2px 15px #0001;padding:18px 0;position:sticky;top:0;z-index:10}
.nav{display:flex;justify-content:space-between;align-items:center;gap:15px}
.brand{font-size:24px;font-weight:800;color:#4f46e5}.user{color:#475569}
.dashboard{padding:35px 0}.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:30px;border-radius:24px;margin-bottom:30px}
.hero h1{margin-bottom:8px}.subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.subject{background:#fff;border:0;padding:25px;border-radius:20px;text-align:left;cursor:pointer;box-shadow:0 8px 25px #0001;transition:.2s}
.subject:hover{transform:translateY(-4px);box-shadow:0 14px 30px #0002}.icon{font-size:35px;margin-bottom:15px}.subject h3{margin-bottom:7px}.subject p{color:#64748b}
.exam{padding:30px 0}.exam-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:15px}
.timer{background:#fee2e2;color:#dc2626;padding:12px 18px;border-radius:12px;font-weight:bold}
.progress{height:9px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin-bottom:25px}
.progress-bar{height:100%;width:0;background:#4f46e5;transition:.3s}
.question-box{background:#fff;border-radius:22px;padding:30px;box-shadow:0 10px 30px #0001}
.question-number{color:#4f46e5;font-weight:bold;margin-bottom:15px}.question{font-size:21px;font-weight:bold;line-height:1.5;margin-bottom:25px}
.options{display:grid;gap:12px}.option{padding:16px;border:2px solid #e2e8f0;border-radius:14px;cursor:pointer;transition:.2s}
.option:hover{border-color:#818cf8;background:#f5f3ff}.option.selected{border-color:#4f46e5;background:#eef2ff}
.nav-buttons{display:flex;justify-content:space-between;gap:15px;margin-top:25px}
.nav-buttons button{border:0;padding:13px 22px;border-radius:12px;cursor:pointer;font-weight:bold}
.prev{background:#e2e8f0}.next{background:#4f46e5;color:#fff}.finish{background:#16a34a;color:#fff}
.numbers{display:grid;grid-template-columns:repeat(auto-fill,minmax(45px,1fr));gap:8px;margin-top:25px}
.num{border:0;padding:10px;border-radius:9px;background:#e2e8f0;cursor:pointer}.num.answered{background:#22c55e;color:#fff}.num.current{outline:3px solid #6366f1}
.result{min-height:100vh;display:flex;justify-content:center;align-items:center}.result-box{background:#fff;width:500px;max-width:94%;padding:40px;border-radius:25px;text-align:center;box-shadow:0 15px 50px #0002}
.score{font-size:65px;font-weight:800;color:#4f46e5;margin:20px}.info{color:#64748b;line-height:1.8}
@media(max-width:600px){.login-box{padding:25px}.question-box{padding:20px}.question{font-size:18px}}
</style>

<body>
<section id="loginPage" class="login">
<div class="login-box">
<div class="logo">📚 UjianKu</div><div class="subtitle">Sistem Ujian Daring</div>
<label>Nama Peserta</label><input id="nameInput" class="input" placeholder="Masukkan nama">
<label>Password / PIN</label><input id="passwordInput" class="input" type="password" placeholder="Masukkan password">
<button class="btn" onclick="login()">Masuk ke Ujian</button>
</div></section>

<section id="dashboardPage" class="hidden">

<div class="subject-grid">
<button class="subject" onclick="startExam('Matematika')"><div class="icon">📐</div><h3>Matematika</h3><p>50 soal • 60 menit</p></button>
<button class="subject" onclick="startExam('IPA')"><div class="icon">🔬</div><h3>IPA</h3><p>50 soal • 60 menit</p></button>

<button class="subject" onclick="startExam('Bahasa Indonesia')"><div class="icon">📖</div><h3>Bahasa Indonesia</h3><p>50 soal • 60 menit</p></button>
<button class="subject" onclick="startExam('Bahasa Inggris')"><div class="icon">🇬🇧</div><h3>Bahasa Inggris</h3><p>50 soal • 60 menit</p></button>
<button class="subject" onclick="startExam('PPKn')"><div class="icon">🇮🇩</div><h3>PPKn</h3><p>50 soal • 60 menit</p></button>
<button class="subject" onclick="startExam('Informatika')"><div class="icon">💻</div><h3>Informatika</h3><p>50 soal • 60 menit</p></button>
<button class="subject" onclick="startExam('Agama')"><div class="icon">📿</div><h3>Pendidikan Agama</h3><p>50 soal • 60 menit</p></button>
</div></main></section>

<section id="examPage" class="hidden">
<header><div class="container nav"><div><div class="brand">UjianKu</div><small id="examSubject"></small></div><div class="timer">⏱ <span id="timer">60:00</span></div></div></header>
<main class="container exam">
<div class="progress"><div id="progressBar" class="progress-bar"></div></div>
<div class="question-box">
<div class="question-number" id="questionNumber"></div><div class="question" id="questionText"></div><div class="options" id="options"></div>
<div class="nav-buttons"><button class="prev" onclick="previousQuestion()">← Sebelumnya</button><button class="next" id="nextBtn" onclick="nextQuestion()">Berikutnya →</button></div>
</div><div class="numbers" id="numbers"></div>
</main></section>

<section id="resultPage" class="result hidden">
<div class="result-box"><h1>🎉 Ujian Selesai!</h1><div class="score"><span id="score">0</span></div>
<div class="info"><div>Peserta: <b id="resultName"></b></div><div>Mata Pelajaran: <b id="resultSubject"></b></div><div>Jawaban benar: <b id="correctCount"></b> / <b id="totalCount"></b></div></div><br>
<button class="btn" onclick="backToDashboard()">Kembali ke Dashboard</button></div>
</section>

let currentUser="",currentSubject="",questions=[],answers=[],currentQuestion=0,timeLeft=3600,timerInterval;

function login(){
 const name=document.getElementById("nameInput").value.trim(),pass=document.getElementById("passwordInput").value.trim();
 if(!name||!pass){alert("Nama dan password harus diisi!");return}
 currentUser=name;document.getElementById("userName").textContent=name;document.getElementById("welcomeName").textContent=name;
 document.getElementById("loginPage").classList.add("hidden");document.getElementById("dashboardPage").classList.remove("hidden");
}
function startExam(subject){
 if(!bankSoal[subject]?.length){alert("Soal untuk "+subject+" belum tersedia.");return}
 currentSubject=subject;questions=[...bankSoal[subject]];answers=new Array(questions.length).fill(null);currentQuestion=0;timeLeft=3600;
 document.getElementById("dashboardPage").classList.add("hidden");document.getElementById("examPage").classList.remove("hidden");
 document.getElementById("examSubject").textContent=subject+" • "+questions.length+" soal";createNumbers();showQuestion();startTimer();
}
function showQuestion(){
 const q=questions[currentQuestion];document.getElementById("questionNumber").textContent=`Soal ${currentQuestion+1} dari ${questions.length}`;
 document.getElementById("questionText").textContent=q.question;const box=document.getElementById("options");box.innerHTML="";
 q.options.forEach((opt,i)=>{const d=document.createElement("div");d.className="option"+(answers[currentQuestion]===i?" selected":"");d.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${opt}`;d.onclick=()=>{answers[currentQuestion]=i;showQuestion()};box.appendChild(d)});
 document.getElementById("progressBar").style.width=((currentQuestion+1)/questions.length*100)+"%";updateNumbers();
 document.querySelector(".prev").disabled=currentQuestion===0;const b=document.getElementById("nextBtn");
 if(currentQuestion===questions.length-1){b.textContent="✓ Selesai";b.className="finish"}else{b.textContent="Berikutnya →";b.className="next"}
}
function createNumbers(){const box=document.getElementById("numbers");box.innerHTML="";questions.forEach((_,i)=>{const b=document.createElement("button");b.className="num";b.textContent=i+1;b.onclick=()=>{currentQuestion=i;showQuestion()};box.appendChild(b)})}
function updateNumbers(){document.querySelectorAll(".num").forEach((n,i)=>{n.classList.toggle("answered",answers[i]!==null);n.classList.toggle("current",i===currentQuestion)})}
function nextQuestion(){if(currentQuestion===questions.length-1){finishExam();return}currentQuestion++;showQuestion()}
function previousQuestion(){if(currentQuestion>0){currentQuestion--;showQuestion()}}
function startTimer(){clearInterval(timerInterval);updateTimer();timerInterval=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft<=0){clearInterval(timerInterval);alert("Waktu ujian telah habis.");calculateResult()}},1000)}
function updateTimer(){document.getElementById("timer").textContent=String(Math.floor(timeLeft/60)).padStart(2,"0")+":"+String(timeLeft%60).padStart(2,"0")}
function finishExam(){const u=answers.filter(a=>a===null).length;if(u&&!confirm(`Masih ada ${u} soal yang belum dijawab.\n\nTetap kumpulkan ujian?`))return;calculateResult()}
function calculateResult(){clearInterval(timerInterval);let correct=0;questions.forEach((q,i)=>{if(answers[i]===q.answer)correct++});const score=Math.round(correct/questions.length*100);
 document.getElementById("examPage").classList.add("hidden");document.getElementById("resultPage").classList.remove("hidden");
 document.getElementById("score").textContent=score;document.getElementById("resultName").textContent=currentUser;document.getElementById("resultSubject").textContent=currentSubject;document.getElementById("correctCount").textContent=correct;document.getElementById("totalCount").textContent=questions.length}
function backToDashboard(){document.getElementById("resultPage").classList.add("hidden");document.getElementById("dashboardPage").classList.remove("hidden");currentSubject="";questions=[];answers=[];currentQuestion=0}
</script>
